<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlabsHub — Sales Agent Prototype</title>
<style>
  :root {
    --yellow: #FFD84D;
    --ink: #14110c;
    --paper: #fffdf7;
    --line: #14110c;
    --muted: #6b6355;
    --grid: #dfe8f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: var(--grid);
    background-image: linear-gradient(#cfe0f0 1px, transparent 1px), linear-gradient(90deg, #cfe0f0 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .shell { width: 100%; max-width: 1120px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); } }

  .chat { background: var(--paper); border: 2px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; height: 78vh; min-height: 520px; overflow: hidden; }
  .head { background: var(--yellow); border-bottom: 2px solid var(--line); padding: 14px 18px; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 24px; letter-spacing: -0.3px; }
  .brand em { font-style: italic; }
  .kicker { font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: #6b5a12; margin-top: 3px; }

  .stream { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 4px; font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-wrap: break-word; }
  .row.bot .bubble { background: #fff; }
  .row.me .bubble { background: var(--yellow); }
  .bubble a { color: #1a4fa0; }
  .who { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .rtl { direction: rtl; text-align: right; }

  .chips { padding: 0 18px 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 12.5px; background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 6px 13px; cursor: pointer; direction: rtl; }
  .chip:hover { background: var(--yellow); }

  .composer { border-top: 2px solid var(--line); padding: 12px; display: flex; gap: 10px; background: #fff; }
  #msg { flex: 1; font: inherit; font-size: 15px; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 4px; direction: rtl; }
  #send { font: inherit; font-size: 14px; padding: 11px 22px; background: var(--ink); color: var(--yellow); border: none; border-radius: 4px; cursor: pointer; }
  #send:disabled { opacity: 0.45; cursor: default; }

  .side { background: var(--paper); border: 2px solid var(--line); border-radius: 4px; padding: 16px; direction: rtl; }
  .side h2 { font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #e8e2d4; }
  .stat b { font-weight: 600; }
  .tools { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 44vh; overflow-y: auto; }
  .tool { border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; font-size: 12px; background: #fff; direction: ltr; text-align: left; }
  .tool .n { font-weight: 600; }
  .tool .i { color: var(--muted); word-break: break-all; }
  .empty { font-size: 12.5px; color: var(--muted); }
  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; background: var(--muted); border-radius: 50%; animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes b { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
</style>
</head>
<body>
<div class="shell">

  <div class="chat">
    <div class="head">
      <div class="brand">Slabs<em>Hub</em></div>
      <div class="kicker">AI sales agent · prototype</div>
    </div>

    <div class="stream" id="stream"></div>

    <div class="chips" id="chips">
      <button class="chip">יש לך צ'ריזארד?</button>
      <button class="chip">מחפש משהו עד 100 שקל</button>
      <button class="chip">מה זה PSA 9 בעצם?</button>
      <button class="chip">אפשר הנחה?</button>
      <button class="chip">איך אני יודע שזה אמיתי?</button>
    </div>

    <div class="composer">
      <input id="msg" placeholder="תכתוב משהו..." autocomplete="off">
      <button id="send">שלח</button>
    </div>
  </div>

  <div class="side">
    <h2>מצב</h2>
    <div class="stat"><span>מוצרים בקטלוג</span><b id="s-products">—</b></div>
    <div class="stat"><span>במלאי</span><b id="s-stock">—</b></div>
    <div class="stat"><span>מודל</span><b id="s-model">—</b></div>
    <div class="stat"><span>מפתח API</span><b id="s-key">—</b></div>

    <h2 style="margin-top:20px">מה הסוכן באמת עשה</h2>
    <div class="tools" id="tools"><div class="empty">כל חיפוש במלאי יופיע כאן. אם הסוכן אומר מחיר שלא הופיע כאן — הוא המציא.</div></div>
  </div>

</div>

<script>
const stream = document.getElementById('stream');
const toolsEl = document.getElementById('tools');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send');
let history = [];
let busy = false;

const isRtl = t => /[֐-׿]/.test(t);

function linkify(t) {
  const esc = t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  return esc.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function add(who, text) {
  const row = document.createElement('div');
  row.className = 'row ' + (who === 'me' ? 'me' : 'bot');
  const b = document.createElement('div');
  b.className = 'bubble' + (isRtl(text) ? ' rtl' : '');
  b.innerHTML = '<div class="who">' + (who === 'me' ? 'אתה' : 'SlabsHub AI') + '</div>' + linkify(text);
  row.appendChild(b);
  stream.appendChild(row);
  stream.scrollTop = stream.scrollHeight;
  return row;
}

function thinking() {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = '<div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div>';
  stream.appendChild(row);
  stream.scrollTop = stream.scrollHeight;
  return row;
}

function renderTools(trace) {
  if (!trace || !trace.length) return;
  if (toolsEl.querySelector('.empty')) toolsEl.innerHTML = '';
  trace.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tool';
    const found = t.output && t.output.showing !== undefined ? t.output.showing + ' of ' + t.output.matches : 'logged';
    d.innerHTML = '<div class="n">' + t.tool + ' → ' + found + '</div><div class="i">' + JSON.stringify(t.input) + '</div>';
    toolsEl.appendChild(d);
  });
  toolsEl.scrollTop = toolsEl.scrollHeight;
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true;
  sendBtn.disabled = true;
  add('me', text);
  history.push({ role: 'user', content: text });
  const wait = thinking();
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await r.json();
    wait.remove();
    if (data.messages) history = data.messages;
    add('bot', data.reply || '(אין תשובה)');
    renderTools(data.trace);
  } catch (e) {
    wait.remove();
    add('bot', 'לא הצלחתי להגיע לשרת. רץ py server.py?');
  }
  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.onclick = () => { const v = input.value; input.value = ''; send(v); };
input.onkeydown = e => { if (e.key === 'Enter') sendBtn.onclick(); };
document.getElementById('chips').onclick = e => {
  if (e.target.classList.contains('chip')) send(e.target.textContent);
};

fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('s-products').textContent = h.products;
  document.getElementById('s-stock').textContent = h.in_stock;
  document.getElementById('s-model').textContent = h.model;
  document.getElementById('s-key').textContent = h.key ? 'קיים' : 'חסר';
});

add('bot', 'היי! אני העוזר הדיגיטלי של SlabsHub — סוכן AI, לא בן אדם.\nמחפש קלף מסוים, או שנתחיל מהתקציב?');
</script>
</body>
</html>
