<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SlabsHub — Mewtwo AR 183/165 Promo 1080x1350</title>
<!--
  Open this file in a browser and screenshot the 1080x1350 canvas for a ready-to-post image.
  Hero: promo-main.png (AI-composited from the Shopify product photo
  https://cdn.shopify.com/s/files/1/0622/2069/7711/files/Mewtwo_183PokemonJapaneseScarlet_Violet151.png?v=1747636121).
  Keep promo.html and promo-main.png in the same folder. If promo-main.png is missing,
  the gradient background still renders as a fallback.
-->
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 620px 780px at 50% 56%, rgba(123, 63, 228, 0.38) 0%, rgba(123, 63, 228, 0) 62%),
      radial-gradient(ellipse 520px 640px at 26% 40%, rgba(59, 107, 214, 0.28) 0%, rgba(59, 107, 214, 0) 65%),
      linear-gradient(180deg, #0b0714 0%, #0d0a1a 48%, #070510 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
  }
  .hero {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* soft dark scrim so overlay text stays readable at top and bottom */
  .scrim-top, .scrim-bottom {
    position: absolute; left: 0; right: 0; height: 260px; pointer-events: none;
  }
  .scrim-top    { top: 0;    background: linear-gradient(180deg, rgba(5, 3, 12, 0.72) 0%, rgba(5, 3, 12, 0) 100%); }
  .scrim-bottom { bottom: 0; background: linear-gradient(0deg,   rgba(5, 3, 12, 0.72) 0%, rgba(5, 3, 12, 0) 100%); }

  .hook {
    position: absolute;
    top: 74px; left: 0; right: 0;
    text-align: center;
    font-size: 66px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 0 34px rgba(123, 63, 228, 0.65), 0 2px 8px rgba(0, 0, 0, 0.8);
  }
  .subhook {
    position: absolute;
    top: 168px; left: 0; right: 0;
    text-align: center;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.66);
  }
  .price {
    position: absolute;
    right: 64px; bottom: 72px;
    padding: 20px 40px;
    border-radius: 999px;
    background: linear-gradient(rgba(18, 8, 31, 0.92), rgba(18, 8, 31, 0.92)) padding-box,
                linear-gradient(135deg, #a06bff, #4f7bff) border-box;
    border: 3px solid transparent;
    text-align: center;
    box-shadow: 0 0 40px rgba(123, 63, 228, 0.45);
  }
  .price .amount { font-size: 56px; font-weight: 800; line-height: 1; }
  .price .market { font-size: 21px; color: rgba(255, 255, 255, 0.62); margin-top: 7px; }

  .tag {
    position: absolute;
    left: 64px; bottom: 96px;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.68);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
  }
  .tag .dot-live {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #a06bff;
    margin-right: 14px;
    box-shadow: 0 0 12px rgba(160, 107, 255, 0.9);
    vertical-align: 2px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="hero" src="promo-main.png" alt="Mewtwo AR 183/165 Japanese Pokemon 151 raw card on a dark psychic-energy background" onerror="this.style.display='none'">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <div class="hook">Mewtwo AR. Under market.</div>
    <div class="subhook">Japanese 151 &middot; Secret Rarity &middot; Raw</div>

    <div class="tag"><span class="dot-live"></span>Raw &middot; 1 in stock</div>

    <div class="price">
      <div class="amount">$19.99</div>
      <div class="market">market $24.59</div>
    </div>
  </div>
</body>
</html>
