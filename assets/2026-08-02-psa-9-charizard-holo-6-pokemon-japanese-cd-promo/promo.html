<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SlabsHub — PSA 9 Charizard CD Promo (1080x1350)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; display: flex; justify-content: center; padding: 20px;
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .post {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(ellipse 900px 500px at 50% 108%, rgba(255,106,20,.38), transparent 62%),
      radial-gradient(ellipse 600px 700px at 50% 62%, rgba(255,122,26,.14), transparent 70%),
      radial-gradient(ellipse 1200px 900px at 50% -10%, #17120e 0%, #0b0908 60%),
      #0b0908;
  }
  /* rising embers */
  .ember { position: absolute; border-radius: 50%; background: #ff8a2a;
           box-shadow: 0 0 12px 3px rgba(255,122,26,.55); opacity: .8; }
  .e1 { width: 5px; height: 5px; left: 12%; top: 68%; }
  .e2 { width: 3px; height: 3px; left: 18%; top: 45%; opacity: .5; }
  .e3 { width: 6px; height: 6px; left: 86%; top: 72%; }
  .e4 { width: 4px; height: 4px; left: 90%; top: 38%; opacity: .55; }
  .e5 { width: 3px; height: 3px; left: 79%; top: 55%; opacity: .45; }
  .e6 { width: 4px; height: 4px; left: 8%;  top: 30%; opacity: .35; }
  .e7 { width: 3px; height: 3px; left: 68%; top: 18%; opacity: .3; }
  .e8 { width: 3px; height: 3px; left: 28%; top: 14%; opacity: .3; }

  .header { position: absolute; top: 60px; width: 100%; text-align: center; }
  .hook {
    color: #fff; font-size: 58px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; white-space: nowrap;
    text-shadow: 0 4px 24px rgba(0,0,0,.8);
  }
  .subhook {
    margin-top: 18px;
    color: #d9b36b; font-size: 28px; font-weight: 600; letter-spacing: 6px;
    text-transform: uppercase;
  }
  .slab-wrap { position: absolute; top: 250px; left: 50%; transform: translateX(-50%);
               width: 720px; text-align: center; }
  .slab-wrap img {
    width: 100%; display: block; border-radius: 10px;
    box-shadow: 0 0 90px 10px rgba(255,110,26,.28), 0 40px 80px rgba(0,0,0,.75);
  }
  .reflection {
    position: absolute; left: 50%; transform: translateX(-50%) scaleY(-.28);
    top: 1188px; width: 720px; opacity: .18; filter: blur(3px);
    -webkit-mask-image: linear-gradient(to top, #000 20%, transparent 85%);
            mask-image: linear-gradient(to top, #000 20%, transparent 85%);
  }
  .grade-badge {
    position: absolute; top: 262px; right: 96px;
    background: #b3121b; color: #fff; padding: 16px 26px; border-radius: 12px;
    font-weight: 800; text-align: center; line-height: 1.1;
    box-shadow: 0 8px 30px rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.25);
  }
  .grade-badge .g-top { font-size: 24px; letter-spacing: 3px; }
  .grade-badge .g-num { font-size: 52px; }
  .price-pill {
    position: absolute; bottom: 84px; right: 84px;
    background: linear-gradient(135deg, #ff7a1a, #e8590c);
    color: #fff; padding: 22px 44px; border-radius: 999px;
    font-size: 56px; font-weight: 800; letter-spacing: 1px;
    box-shadow: 0 0 50px rgba(255,122,26,.5), 0 12px 30px rgba(0,0,0,.6);
  }
  .price-label { position: absolute; bottom: 208px; right: 92px; color: #d9b36b;
                 font-size: 24px; font-weight: 600; letter-spacing: 4px;
                 text-transform: uppercase; }
  .brand { position: absolute; bottom: 92px; left: 92px; color: #fff;
           font-size: 40px; font-weight: 800; letter-spacing: 3px; }
  .brand span { color: #ff7a1a; }
  .cta { position: absolute; bottom: 62px; left: 94px; color: #9a8f85;
         font-size: 22px; letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="post">
    <div class="ember e1"></div><div class="ember e2"></div><div class="ember e3"></div>
    <div class="ember e4"></div><div class="ember e5"></div><div class="ember e6"></div>
    <div class="ember e7"></div><div class="ember e8"></div>

    <div class="header">
      <div class="hook">The 1999 CD Promo Charizard</div>
      <div class="subhook">Japanese old-back holo &middot; Sugimori art</div>
    </div>

    <div class="slab-wrap">
      <img src="https://cdn.shopify.com/s/files/1/0622/2069/7711/files/Charizard_Holo_6PokemonJapaneseCDPromo.png?v=1746856362"
           alt="PSA 9 Charizard Holo #6 Japanese CD Promo slab">
    </div>
    <img class="reflection"
         src="https://cdn.shopify.com/s/files/1/0622/2069/7711/files/Charizard_Holo_6PokemonJapaneseCDPromo.png?v=1746856362"
         alt="">

    <div class="grade-badge"><div class="g-top">PSA</div><div class="g-num">9</div></div>

    <div class="price-label">One copy in stock</div>
    <div class="price-pill">$1,199</div>

    <div class="brand">SLABS<span>HUB</span></div>
    <div class="cta">slabshub.com &middot; link in bio</div>
  </div>
</body>
</html>
